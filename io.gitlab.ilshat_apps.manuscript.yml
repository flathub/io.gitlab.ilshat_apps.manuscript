app-id: io.gitlab.ilshat_apps.manuscript
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: manuscript

finish-args:
  # Access to Documents folder for opening and saving markdown files.
  # Broader filesystem access (home:ro) is blocked by the Flathub linter
  # — sibling images outside the xdg-document-portal mount remain
  # inaccessible from the sandbox until a linter exception is granted.
  # Tracked as a v1.5 follow-up.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures:ro
  # Wayland & X11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network access for fetching remote images referenced as
  # ![alt](https://…) — bytes are read via gio::File::load_bytes_async
  # and decoded in-process, never written to disk.
  - --share=network
  # GPU acceleration
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/manuscript/cargo
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

modules:
  # Spell-check backend used by the editor's source views. Not in the GNOME 50
  # runtime, so we build it from source.
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Dvapi=false
      - -Ddocs=false
      - -Dintrospection=disabled
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/libspelling/-/archive/0.4.10/libspelling-0.4.10.tar.bz2
        sha256: d6388f3dc207269743ec920b14bb3be55ab4bd97a18e167b52a09cec0554dc2b

  # Inter font (SIL OFL 1.1) — shipped so the app's default font_family: "Inter"
  # resolves inside the sandbox instead of falling through to generic sans.
  - name: inter-font
    buildsystem: simple
    build-commands:
      - install -d /app/share/fonts
      - cp InterVariable.ttf InterVariable-Italic.ttf /app/share/fonts/
      - cp extras/ttf/Inter-*.ttf /app/share/fonts/
    sources:
      - type: archive
        url: https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
        sha256: 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e

  - name: manuscript
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/manuscript/cargo
    build-commands:
      - |
        mkdir -p .cargo
        cat > .cargo/config.toml <<CONF
        [source.crates-io]
        replace-with = "vendored-sources"
        [source.vendored-sources]
        directory = "cargo/vendor"
        CONF
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/manuscript /app/bin/manuscript
      - install -Dm644 data/io.gitlab.ilshat_apps.manuscript.desktop /app/share/applications/io.gitlab.ilshat_apps.manuscript.desktop
      - install -Dm644 data/io.gitlab.ilshat_apps.manuscript.metainfo.xml /app/share/metainfo/io.gitlab.ilshat_apps.manuscript.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.gitlab.ilshat_apps.manuscript.svg /app/share/icons/hicolor/scalable/apps/io.gitlab.ilshat_apps.manuscript.svg
      - install -Dm644 LICENSE /app/share/licenses/io.gitlab.ilshat_apps.manuscript/LICENSE
    sources:
      - type: git
        url: https://gitlab.com/ilshat-apps/manuscript.git
        tag: v1.4.0
        commit: f6b436b1d1519a4a7157022904a571fb38be300b
      - cargo-sources.json
